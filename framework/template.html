<!DOCTYPE html>
<html lang="{{UI:html_lang}}" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        /* @@INCLUDE:css/base.css@@ */

        /* @@INCLUDE:css/sidebar.css@@ */

        /* @@INCLUDE:css/study-tools.css@@ */

        /* @@INCLUDE:css/sidebar-contents.css@@ */

        /* @@INCLUDE:css/content.css@@ */

        /* @@INCLUDE:css/flashcards.css@@ */

        /* @@ZONE:EXTRA_CSS@@ */

        /* @@INCLUDE:css/mcq.css@@ */

        /* @@INCLUDE:css/lightbox.css@@ */

        /* @@INCLUDE:css/quiz.css@@ */

        /* @@INCLUDE:css/footer.css@@ */

        /* @@INCLUDE:css/responsive.css@@ */
        /* @@INCLUDE:css/print.css@@ */

        /* @@INCLUDE:css/reading.css@@ */

        /* @@INCLUDE:css/teaching.css@@ */

</style>
</head>
<body>

    <!-- Selection Highlighter Toolbar -->
    <div id="text-selection-toolbar">
        <button class="hl-action-btn" id="add-hl-btn" onclick="applyHighlight()" title="{{UI:hl_add_title}}">{{UI:hl_add}}</button>
        <button class="hl-action-btn" id="add-note-btn" onclick="openNoteEditor()" title="{{UI:note_add_title}}">{{UI:note_add}}</button>
        <button class="hl-action-btn" id="remove-hl-btn" onclick="removeHighlightAtSelection()" style="display:none; color: #f87171;" title="{{UI:hl_remove_title}}">{{UI:hl_remove}}</button>
    </div>

    <!-- Note Editor Popover -->
    <div id="note-editor">
        <textarea id="note-editor-text" placeholder="{{UI:note_placeholder}}"></textarea>
        <div class="note-editor-btns">
            <button class="hl-action-btn" id="note-delete-btn" onclick="deleteNote()" style="display:none; color: #f87171;">{{UI:note_delete}}</button>
            <button class="hl-action-btn" onclick="closeNoteEditor()">{{UI:note_cancel}}</button>
            <button class="hl-action-btn" onclick="saveNote()" style="color: #4ade80;">{{UI:note_save}}</button>
        </div>
    </div>

    <!-- Term Lexicon Hover Card -->
    <div id="term-card">
        <div class="tc-head">
            <span id="tc-term"></span>
            <button id="tc-speak" title="{{UI:term_speak_title}}">{{UI:term_speak}}</button>
        </div>
        <div class="tc-row"><span class="tc-label">IPA</span><span id="tc-ipa"></span></div>
        <div class="tc-row"><span class="tc-label">{{UI:term_chunks}}</span><span id="tc-chunks"></span></div>
        <div class="tc-row"><span class="tc-label">{{UI:term_parts}}</span><span id="tc-parts"></span></div>
        <div class="tc-hook" id="tc-hook"></div>
    </div>

    <!-- Progress Bar -->
    <div id="progress-bar"></div>

    <!-- Universal Floating Sidebar Toggle Button -->
    <button id="sidebar-toggle-pill" onclick="toggleSidebar()" title="{{UI:sidebar_toggle_title}}">
        <span id="sidebar-pill-icon">◀</span> <span id="sidebar-pill-text">{{UI:sidebar_collapse}}</span>
    </button>

    <!-- Mobile Backdrop -->
    <div id="sidebar-backdrop" onclick="toggleSidebar(false)"></div>

    <!-- Sidebar Navigation -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <h2>
                <span>{{SIDEBAR_TITLE}}</span>
                <div style="display: flex; gap: 6px; align-items: center;">
                    <button class="theme-btn" onclick="toggleTheme()" id="theme-toggle-btn">{{UI:theme_dark}}</button>
                    <button class="sidebar-collapse-btn" onclick="toggleSidebar(false)" title="{{UI:sidebar_collapse_title}}">◀</button>
                </div>
            </h2>
            <div class="sidebar-meta">{{SIDEBAR_META}}</div>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="{{SEARCH_PLACEHOLDER}}" onkeyup="filterContent()">
        </div>

        <nav>
            <ul id="navList">
<!-- @@ZONE:NAV@@ -->
            </ul>
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-footer-title">{{UI:data_title_before}}<span id="note-count">0</span>{{UI:data_title_after}}</div>
            <button class="data-btn" onclick="exportStudyData()" title="{{UI:export_title}}">{{UI:export}}</button>
            <button class="data-btn" onclick="document.getElementById('import-file-input').click()" title="{{UI:import_title}}">{{UI:import}}</button>
            <button class="data-btn" onclick="copyNotesAsMarkdown()" title="{{UI:copy_md_title}}">{{UI:copy_md}}</button>
            <input type="file" id="import-file-input" accept=".json,application/json" style="display:none" onchange="importStudyData(this.files[0]); this.value='';">
        </div>
    </aside>

    <!-- Main Content Area -->
    <main id="main-content">
        
        <!-- Header Banner -->
        <!-- @@ZONE:HEADER@@ --><!-- @@ZONE:CONTENT@@ --></main>

    <!-- Toast Notification -->
    <div id="toast-msg"></div>

    <!-- Lightbox Modal -->
    <div id="lightbox-modal" onclick="closeLightbox(event)">
        <span class="lightbox-close" onclick="closeLightbox(event)" role="button" tabindex="0" aria-label="{{UI:lightbox_close}}">&times;</span>
        <img id="lightbox-img" src="" alt="{{UI:lightbox_alt}}">
        <div id="lightbox-caption"></div>
    </div>

    <!-- Interactive Scripts -->
    <script>
        // ==========================================
        // DOCUMENT IDENTITY & STORAGE NAMESPACE
        // DOC_ID 派生全部 localStorage 键：同一 origin 下多份讲义互不覆盖
        // ==========================================
        const DOC_ID = {{DOC_ID_JSON}};
        const APP_ID = {{APP_ID_JSON}};
        const GUIDE_TITLE = {{GUIDE_TITLE_JSON}};
        // Interface strings in the guide's language (config "lang"), from framework/ui_strings.json.
        // t("key", { n: 3 }) fills {n}-style slots. Static HTML gets its strings at build time.
        const UI = {{UI_STRINGS_JSON}};
        function t(key, vars) {
            return UI[key].replace(/\{(\w+)\}/g, (m, k) => (vars && k in vars ? String(vars[k]) : m));
        }
        const LS = {
            theme: DOC_ID + "_theme",
            sidebar: DOC_ID + "_sidebar_collapsed",
            highlights: DOC_ID + "_study_highlights_v4",
            notes: DOC_ID + "_study_notes_v1"
        };

        // @@INCLUDE:js/page-ui.js@@

        // @@ZONE:EXTRA_JS@@

        // Flashcards Data
        // @@ZONE:DATA:flashcards@@

        // @@INCLUDE:js/flashcards.js@@

        // MCQ Questions Data
        // @@ZONE:DATA:mcqData@@

        // @@INCLUDE:js/mcq.js@@

        // @@INCLUDE:js/quiz.js@@

        // @@INCLUDE:js/sidebar.js@@

        // @@INCLUDE:js/annotations.js@@

        // @@INCLUDE:js/storage.js@@

        // @@INCLUDE:js/text-model.js@@

        // @@INCLUDE:js/highlights.js@@

        // @@INCLUDE:js/notes.js@@

        // @@INCLUDE:js/study-data.js@@

        // ==========================================
        // TERM LEXICON HOVER CARDS (IPA + Native-style Chunked Pronunciation + Etymology)
        // Attaches to #main-content span.en / strong whose normalized text matches a key.
        // ==========================================
        // @@ZONE:DATA:termLexicon@@

        // @@INCLUDE:js/term-cards.js@@

        // @@INCLUDE:js/a11y.js@@

        // @@INCLUDE:js/print.js@@

        // @@INCLUDE:js/toast.js@@

        // @@INCLUDE:js/init.js@@
    </script>
</body>
</html>
