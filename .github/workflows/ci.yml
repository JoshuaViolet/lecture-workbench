name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Python 3.9, the oldest supported version (and macOS's built-in python3), has no build for
    # Ubuntu 26.04, which ubuntu-latest now is; its job stays on the newest image that has one.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test dependencies
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Build and validate every subject
        run: python framework/cli.py build --all --validate
      - name: Run tests
        run: pytest
