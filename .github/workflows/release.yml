name: Release

# Pushing a tag such as v0.3.0 publishes a GitHub release for it. Its notes are that version's
# section of CHANGELOG.md (the lines under "## 0.3.0"), so the release says what the changelog
# says. A tag whose version has no section fails here and publishes nothing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take the notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $version' section, so there is nothing to publish"
            exit 1
          fi
          printf '\nFull list: [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md)\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
