name: Release

# Publishes a GitHub release whose notes are that version's section of CHANGELOG.md (the lines
# under "## 0.3.0"), so the release says what the changelog says. Two ways to start it:
#
# - push a tag such as v0.3.0 (git tag v0.3.0 <commit> && git push origin v0.3.0);
# - or, without git (from a phone too): Actions > Release > Run workflow on main, giving the
#   version (0.3.0). That tags the head of main and publishes the release.
#
# A version with no section in the changelog fails and publishes nothing. A release that already
# exists is left as it is: publishing one by hand on the Releases page creates its tag, which
# starts this workflow too.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as titled in CHANGELOG.md (for example 0.4.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish the release with this version's changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
              echo "::error::Run this from $DEFAULT_BRANCH, so that the release tags the merged code"
              exit 1
            fi
            version="${INPUT_VERSION#v}"
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
              echo "::error::'$INPUT_VERSION' is not a version such as 0.4.0"
              exit 1
            fi
            tag="v$version"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::$tag already has a release (published by hand?); leaving it as it is"
            exit 0
          fi
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $version' section, so there is nothing to publish"
            exit 1
          fi
          printf '\nFull list: [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md)\n' \
            "$GITHUB_REPOSITORY" "$tag" >> notes.md
          # A pushed tag already exists, and then --target is not used; a run from the Actions
          # page creates the tag on the commit it ran on.
          gh release create "$tag" --title "$tag" --notes-file notes.md --target "$GITHUB_SHA"
